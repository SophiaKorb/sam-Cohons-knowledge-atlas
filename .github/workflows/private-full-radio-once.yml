name: One-time encrypted private full-length radio recovery
on:
  push:
    branches: ['research/2026-10-12-radio-writing-refresh']
    paths: ['.github/workflows/private-full-radio-once.yml']
permissions:
  contents: read
env:
  PUBLIC_CERT_B64: ''
jobs:
  preserve_source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recover original publisher audio and encrypt without disclosure
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/sam-radio
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 160 --output /tmp/sam-radio/original.mp3 -- 'https://www.toojewishradio.com/Too%20Jewish%20MP3%27s/Too_Jewish_2026-09-27.mp3'
          echo '819f02fa9585df7728cabcffa251c69348f31d90bd28aeb71d42e71581263b0c  /tmp/sam-radio/original.mp3' | sha256sum -c - >/dev/null
          printf %s "$PUBLIC_CERT_B64" | base64 --decode > /tmp/sam-radio/public-cert.pem
          openssl cms -encrypt -aes256 -binary -in /tmp/sam-radio/original.mp3 -out /tmp/sam-radio/original.cms -outform DER /tmp/sam-radio/public-cert.pem
          mkdir -p encrypted
          cp /tmp/sam-radio/original.cms encrypted/original-publisher-audio.cms
          echo "Checksum matched. Source sealed with offline-held public-key certificate; no raw MP3 in artifact."
      - name: Clear unencrypted source
        if: always()
        run: rm -rf /tmp/sam-radio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-full-radio-source
          path: encrypted/original-publisher-audio.cms
          if-no-files-found: error
          retention-days: 1
  recognize_segments:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: 0, start: 0, duration: 550}
          - {part: 1, start: 550, duration: 550}
          - {part: 2, start: 1100, duration: 550}
          - {part: 3, start: 1650, duration: 550}
          - {part: 4, start: 2200, duration: 550}
          - {part: 5, start: 2750, duration: 545}
    steps:
      - name: Install audio codec and offline ASR runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet --disable-pip-version-check 'faster-whisper==1.2.1'
      - name: Validate source MP3 and decode only designated portion
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/sam-radio
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 160 --output /tmp/sam-radio/original.mp3 -- 'https://www.toojewishradio.com/Too%20Jewish%20MP3%27s/Too_Jewish_2026-09-27.mp3'
          echo '819f02fa9585df7728cabcffa251c69348f31d90bd28aeb71d42e71581263b0c  /tmp/sam-radio/original.mp3' | sha256sum -c - >/dev/null
          ffmpeg -nostdin -hide_banner -loglevel error -ss ${{ matrix.start }} -i /tmp/sam-radio/original.mp3 -t ${{ matrix.duration }} -ac 1 -ar 16000 -y /tmp/sam-radio/part.wav
          test "$(stat -c%s /tmp/sam-radio/part.wav)" -gt 150000
          echo 'Publisher MP3 SHA-256 verified; selected audio chunk decoded.'
      - name: Recognize speech locally and encrypt raw segments
        shell: bash
        env:
          PART: '${{ matrix.part }}'
          START: '${{ matrix.start }}'
          DURATION: '${{ matrix.duration }}'
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/sam-radio/process.py <<'PY'
          import json,os,pathlib,wave
          import numpy as np
          from faster_whisper import WhisperModel
          root=pathlib.Path('/tmp/sam-radio')
          with wave.open(str(root/'part.wav'),'rb') as f:
              assert f.getnchannels()==1 and f.getframerate()==16000 and f.getsampwidth()==2
              audio=np.frombuffer(f.readframes(f.getnframes()),dtype=np.int16).astype(np.float32)/32768
          start=int(os.environ['START'])
          model=WhisperModel('small.en',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(audio,language='en',beam_size=5,vad_filter=True,condition_on_previous_text=False)
          rows=[{'start_s':round(start+s.start,2),'end_s':round(start+s.end,2),'text':s.text.strip(),'avg_logprob':round(s.avg_logprob,4),'no_speech_prob':round(s.no_speech_prob,4)} for s in segments]
          result={'episode_id':'tj-2026-09-27','part':int(os.environ['PART']),'window_s':[start,start+int(os.environ['DURATION'])],
              'source_sha256':'819f02fa9585df7728cabcffa251c69348f31d90bd28aeb71d42e71581263b0c','tool':'faster-whisper small.en int8 CPU, beam5, language=en, VAD',
              'status':'private unverified machine raw transcription; music and boundaries may be wrong',
              'speaker_diarization':False,'human_reviewed':False,'segments':rows,
              'raw_words':sum(len(x['text'].split()) for x in rows)}
          (root/'raw-part.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('Part',result['part'],'segments',len(rows),'raw word count',result['raw_words'],'(no text printed)')
          PY
          python /tmp/sam-radio/process.py
          printf %s "$PUBLIC_CERT_B64" | base64 --decode > /tmp/sam-radio/cert.pem
          openssl cms -encrypt -aes256 -binary -in /tmp/sam-radio/raw-part.json -out /tmp/sam-radio/part.cms -outform DER /tmp/sam-radio/cert.pem
          mkdir -p encrypted
          cp /tmp/sam-radio/part.cms encrypted/part-${{ matrix.part }}.cms
      - name: Clear sensitive working files
        if: always()
        run: rm -rf /tmp/sam-radio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-radio-segment-${{ matrix.part }}
          path: encrypted/part-${{ matrix.part }}.cms
          if-no-files-found: error
          retention-days: 1
