name: One-time encrypted private radio comparative ASR
on:
  push:
    branches: ['research/2026-10-12-radio-writing-refresh']
    paths: ['.github/workflows/private-compare-asr-once.yml']
permissions:
  contents: read
jobs:
  private_asr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install decoding tools and local ASR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip >/dev/null
          python -m pip install --quiet --disable-pip-version-check 'faster-whisper==1.2.1'
      - name: Download and verify original bytes, decode private sample
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/sam-private
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 160 \
            --output /tmp/sam-private/original.mp3 \
            -- 'https://www.toojewishradio.com/Too%20Jewish%20MP3%27s/Too_Jewish_2026-09-27.mp3'
          echo '819f02fa9585df7728cabcffa251c69348f31d90bd28aeb71d42e71581263b0c  /tmp/sam-private/original.mp3' | sha256sum -c -
          ffprobe -v error -show_entries format=duration:stream=codec_name -of json /tmp/sam-private/original.mp3 > /tmp/sam-private/probe.json
          ffmpeg -nostdin -hide_banner -loglevel error -ss 00:00:30 \
            -i /tmp/sam-private/original.mp3 -t 300 -ac 1 -ar 16000 -y /tmp/sam-private/decoded.wav
          ffmpeg -nostdin -hide_banner -loglevel error -ss 00:00:30 \
            -i /tmp/sam-private/original.mp3 -t 150 -ac 1 -b:a 96k -y /tmp/sam-private/listening_sample_30-180.mp3
          test "$(stat -c%s /tmp/sam-private/listening_sample_30-180.mp3)" -gt 100000
          echo 'Original SHA-256 verified; 300s decoded and separate 150s reference sample prepared.'
      - name: Generate separate raw ASR and encrypt all deliverables
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/sam-private/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDOzCCAiOgAwIBAgIURHrznfu0FUNrHo9IzLpwpx79cvkwDQYJKoZIhvcNAQEL
          BQAwLTErMCkGA1UEAwwiU2FtIFJhZGlvIFByaXZhdGUgUGlsb3QgMjAyNi0xMC0x
          NDAeFw0yNjEwMTUwNTIwMjZaFw0yNjEwMTcwNTIwMjZaMC0xKzApBgNVBAMMIlNh
          bSBSYWRpbyBQcml2YXRlIFBpbG90IDIwMjYtMTAtMTQwggEiMA0GCSqGSIb3DQEB
          AQUAA4IBDwAwggEKAoIBAQDbcY59w7x23idQsFjy+W80I20eaff6gnWvgRkwdNxC
          79Pg+zSeMAVyNwXwNDTIQN2HgOuIiZ/xwugUnxAI0gQZXvHqQApI+THYZz5SRpU/
          RFACfbz9ISeqpL1bR/LDZ71MiAwndWXuW5m8Kc1IhJYCJe8P+msnWPSZvzmy0B0g
          p+LDT/60hcPgIqI5pZqj1gZvdd+wNqYpGFenFnD7VcYdoQmEfaIQm31BPbjdrDHZ
          /L5S24AWO3B3wCUBdoRF/7nXUCtcALhrPJC9UsjpR0WhY24IDSappUVU2x6NdgV+
          +zuW5UKJrtL2boxgDx7LNhRUbwQfosloQ32zcaj6kYpVAgMBAAGjUzBRMB0GA1Ud
          DgQWBBTNHYPaCqWf/I4MUpecHqo/T+TCqzAfBgNVHSMEGDAWgBTNHYPaCqWf/I4M
          UpecHqo/T+TCqzAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBAQBw
          yuu1Z8FxQKahMhWuZYxW9sS2AFn1SS5x7bRNdy2NkzZJ7pOUamP2RsxT9cUWeCjL
          4BGU+Edo0WlDwhMLn+3D+3O189bbKC8uGgDOD0Pfyx1iQYWt695+z9i0udl9Vu0F
          k94g+t1FPf8208w7KScc2oP4eIlmuw7HnhVhKot5eM0l/i5OuhVe4FksXfUhxJBV
          NO/XK4tHi3PaB5dQ7s8y/QQX8PFnSj2P/9H7LlUrxznxzpt7Ux3lQHJ9f1OoSQKj
          UpXJn2BfTYIXwQrmCVoa6cQRf98lf9khRHEm+pNLiq6dHaVCnBfRtxYuJJsj4NIf
          XPN5IywkmJyJ/8ylAoBB
          -----END CERTIFICATE-----
          CERT
          cat > /tmp/sam-private/transcribe.py <<'PY'
          import json,hashlib,pathlib,wave
          import numpy as np
          from faster_whisper import WhisperModel
          base=pathlib.Path('/tmp/sam-private')
          with wave.open(str(base/'decoded.wav'),'rb') as w:
              assert (w.getnchannels(),w.getframerate(),w.getsampwidth())==(1,16000,2)
              pcm=np.frombuffer(w.readframes(w.getnframes()),dtype=np.int16).astype(np.float32)/32768.
          model=WhisperModel('small.en',device='cpu',compute_type='int8',cpu_threads=4)
          chunks,info=model.transcribe(pcm,language='en',beam_size=5,vad_filter=True,condition_on_previous_text=False)
          segments=[{'start_s':round(30+s.start,2),'end_s':round(30+s.end,2),'text':s.text.strip(),
                     'avg_logprob':round(s.avg_logprob,4),'no_speech_prob':round(s.no_speech_prob,4)} for s in chunks]
          result={'episode_id':'tj-2026-09-27','model':'faster-whisper small.en int8; independent second pass',
                  'status':'raw unreviewed; ASR output only, not verified quotation, no diarization',
                  'start_s':30,'end_s':330,'source_sha256':'819f02fa9585df7728cabcffa251c69348f31d90bd28aeb71d42e71581263b0c',
                  'audio_sample_reference':'listening_sample_30-180.mp3','segments':segments,
                  'word_count':sum(len(s['text'].split()) for s in segments)}
          (base/'independent_raw_asr_30-330.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print('Raw second ASR: segments',len(segments),'word count',result['word_count'],'model small.en; no text exposed')
          PY
          python /tmp/sam-private/transcribe.py
          cd /tmp/sam-private
          zip -q -j private_payload.zip independent_raw_asr_30-330.json listening_sample_30-180.mp3 probe.json
          openssl cms -encrypt -aes256 -binary -in private_payload.zip \
            -out private_payload.cms -outform DER cert.pem
          mkdir -p "$GITHUB_WORKSPACE/encrypted-pilot"
          cp private_payload.cms "$GITHUB_WORKSPACE/encrypted-pilot/payload.cms"
          echo 'Only encrypted payload staged; public key only is present on runner.'
      - name: Erase unencrypted working data
        if: always()
        run: rm -rf /tmp/sam-private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-private-comparative-radio-pilot
          path: encrypted-pilot/payload.cms
          if-no-files-found: ignore
          retention-days: 1
