name: Temporary encrypted private Too Jewish transcription pilot
on:
  push:
    branches: ['research/2026-10-12-radio-writing-refresh']
    paths: ['.github/workflows/private-tj-audio-pilot.yml']
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install private sample speech recognizer
        run: |
          python -m pip install --quiet --disable-pip-version-check 'faster-whisper==1.2.1'
      - name: Download official episode to ephemeral worker and convert sample
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/private-tj
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 150 \
            --output /tmp/private-tj/source.mp3 \
            -- 'https://www.toojewishradio.com/Too%20Jewish%20MP3%27s/Too_Jewish_2026-09-27.mp3'
          test "$(stat -c%s /tmp/private-tj/source.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration:stream=codec_name -of json /tmp/private-tj/source.mp3 > /tmp/private-tj/ffprobe.json
          ffmpeg -nostdin -hide_banner -loglevel error -ss 00:00:30 \
            -i /tmp/private-tj/source.mp3 -t 00:02:30 -ac 1 -ar 16000 \
            -y /tmp/private-tj/sample.wav
          test "$(stat -c%s /tmp/private-tj/sample.wav)" -gt 100000
          echo "Publisher MP3 bytes retrieved and 150-second audio sample decoded; no audio payload displayed or uploaded."
      - name: Transcribe limited sample offline and encrypt with ephemeral public certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/private-tj
          cat > /tmp/private-tj/cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEKzCCApOgAwIBAgIUN33UI5/sBwGcJkVIwz2Zz0GgZJUwDQYJKoZIhvcNAQEL
          BQAwJTEjMCEGA1UEAwwaU2FtVG9vSmV3aXNoUGlsb3RUZW1wb3JhcnkwHhcNMjYx
          MDE1MDUwNDQwWhcNMjYxMDE3MDUwNDQwWjAlMSMwIQYDVQQDDBpTYW1Ub29KZXdp
          c2hQaWxvdFRlbXBvcmFyeTCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGB
          ALLKM3/qiTykCo0qIX9lm8WjIro0Gl8ZLFvqRffVU/YJhivJVkLpoKUQvtxuPbmP
          xNadqw0n3lj2Q5VU/ap8p7iwI82oi1i4fjklsvsDtKJcSSWMlf8W+0R867u49jRE
          8WXV6krq1JMYftjNJzUZPlYr2Me3H0vxFRYKu1rrvJkmtSML1NksEmROPMWPBIrh
          +zGyPkDVyacECw/a9y69eozQDSuB+QcncEeBU+rMHJeKt+cxCWX9JA8HitLQV8HC
          lxfkb4AUbC3kIMP2BTWQ6K0su7S11UBH7jYZNBhtMp2J4LwUFKQ88tfTGuwXiPOq
          VlcIU5ImwHTiBc9o5Y7lSQpR//z0+ZVWhFrJ43IId7AebOk5gwfu8Waea/G/v3Uu
          xVzVbK8D7Q/XlzTTNtFCtMVgtQ9zNkRqxSrZwxJ97MGLxO9LXErocscT5UbiQpub
          GOvWQaz7MZcOIZk0jnBGcspm4Za2sAqf1Jg405neBi1t4IDS5MSwGiV3cRU5TeKM
          bQIDAQABo1MwUTAdBgNVHQ4EFgQUKmvos46QUuGCNjGYryZ6RIgvKrswHwYDVR0j
          BBgwFoAUKmvos46QUuGCNjGYryZ6RIgvKrswDwYDVR0TAQH/BAUwAwEB/zANBgkq
          hkiG9w0BAQsFAAOCAYEAiwiSU+p7kywLkMh2shCBn0QvcGszWikeXjX6CjoIN/JQ
          crwnpEkMR3NK67it5ZbXB5GD+376SU3ZQ0bcF5zYAUffWzig4GPHjMxHupkiwfoO
          q3V3I4B9I9Ux7Dw9Z48IAj3aqQxi18wh7kbnDO2T9fpbG7ROm3kigbLWo+QjNDpa
          EaRwvzehyi+YqXBU+RG5PRrfA+nvkkUWK8TT3NcSFbnX+jjgnrUKQYnqFg8AH2Lb
          du0p+0h8xYmfM3HJssBEZEvzq9oKZggDSAeSm+n6KaFzj1L3SJ/P0JEIT2kVJzRe
          IR3YySw63bgAO7f9PzwMN9VCa9RbpGG1jgKGsBY5Ch/CA62IWmNWXNgMQ8dIVlQv
          vYJ4O/AP0OSe6fKFK7wdeh9QeoKV+N6OkW7oq+ILKBDEGJ1HJSK7cN+mqwQR9YGq
          XH0rS5SLUQrA4l5VzGh4iV/ZjOa72QmKnlSJtUe30i/0JRHddy7q/le3TCg1im7Y
          uNE5Q2LUrrHUXHWFpwab
          -----END CERTIFICATE-----
          CERT
          cat > /tmp/private-tj/asr.py <<'PY'
          import json, hashlib, pathlib
          from faster_whisper import WhisperModel
          root=pathlib.Path("/tmp/private-tj")
          info=json.loads((root/"ffprobe.json").read_text())
          model=WhisperModel("tiny.en",device="cpu",compute_type="int8",cpu_threads=4,num_workers=1)
          segments,metadata=model.transcribe(str(root/"sample.wav"),beam_size=3,language="en",vad_filter=True,condition_on_previous_text=False)
          out=[]
          for seg in segments:
              out.append({"start_s":round(30+seg.start,2),"end_s":round(30+seg.end,2),
                          "text":seg.text.strip(),"avg_logprob":round(seg.avg_logprob,3),
                          "no_speech_prob":round(seg.no_speech_prob,3)})
          transcript={"episode_id":"tj-2026-09-27","guest":"Lynn Golodner",
             "source_url":"https://www.toojewishradio.com/Too%20Jewish%20MP3%27s/Too_Jewish_2026-09-27.mp3",
             "source_sha256":hashlib.sha256((root/"source.mp3").read_bytes()).hexdigest(),
             "ffprobe":info,"sample_start_s":30,"sample_end_s":180,
             "model":"faster-whisper tiny.en int8 CPU","status":"raw unverified ASR; not speaker-diarized; may include Hebrew/Jewish name errors",
             "language_hint":"English", "segments":out}
          (root/"transcript-raw.json").write_text(json.dumps(transcript,ensure_ascii=False,indent=2))
          print("Audio codec and length validated; raw ASR segment count:",len(out),"words:",sum(len(x["text"].split()) for x in out))
          PY
          python /tmp/private-tj/asr.py
          openssl cms -encrypt -aes256 -binary -in /tmp/private-tj/transcript-raw.json \
            -out /tmp/private-tj/encrypted-transcript.cms -outform DER \
            /tmp/private-tj/cert.pem
          mkdir -p encrypted-evidence
          cp /tmp/private-tj/encrypted-transcript.cms encrypted-evidence/raw-transcript.cms
          echo "Only public-key-encrypted transcript placed in temporary workflow artifact. Private key is NOT on GitHub."
      - name: Remove ephemeral publisher audio and unencrypted text
        if: always()
        run: |
          rm -f /tmp/private-tj/source.mp3 /tmp/private-tj/sample.wav /tmp/private-tj/transcript-raw.json /tmp/private-tj/asr.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-too-jewish-sept27-pilot
          path: encrypted-evidence/raw-transcript.cms
          if-no-files-found: ignore
          retention-days: 1
